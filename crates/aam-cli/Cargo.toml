[package]
name = "aam-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "aam"
path = "src/main.rs"

[dependencies]
aam-core = { path = "../aam-core" }
aam-vault = { path = "../aam-vault" }
aam-skills = { path = "../aam-skills" }
aam-switcher = { path = "../aam-switcher" }
aam-memory = { path = "../aam-memory" }
aam-sync = { path = "../aam-sync" }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json = "1.0.151"
